<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)" />
<meta name="referrer" content="no-referrer" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Liquid Agent" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="Remote control for Liquid Agent, the private AI agent. End-to-end encrypted." />
<title>Liquid Agent Remote</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="manifest" id="mf" href="/manifest.webmanifest" />
<script>
// iPhone and iPad save the page's own address, pairing key included, when it's
// added to the Home Screen; their manifest has no start_url so nothing overrides it.
(function () {
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios) {
    document.documentElement.classList.add("ios");
    document.getElementById("mf").href = "/manifest-ios.webmanifest";
  }
})();
</script>
<style id="rc-css">
/* Everything here is scoped to #rc so none of it reaches Liquid Agent's own UI. */
html:not(.la){background:#fff;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (prefers-color-scheme:dark){html:not(.la){background:#121213}}
html:not(.la),html:not(.la) body{height:100%;margin:0}
#rc{--bg:#fff;--fg:#0d0d0e;--mute:#6b6d72;--line:#e3e3e7;--card:#f4f4f6;--ac:#1a8cff;--bad:#e5484d;
  box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;
  padding:max(28px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme:dark){#rc{--bg:#121213;--fg:#ececee;--mute:#9a9ca2;--line:#2a2b2f;--card:#1c1c1f;--ac:#339cff;--bad:#ff6369}}
#rc[hidden]{display:none}
#rc.over{position:fixed;inset:0;z-index:2147483000;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#rc *{box-sizing:border-box}
#rc .card{width:100%;max-width:420px;margin:auto;text-align:center}
#rc .logo{width:56px;height:56px;margin:0 auto 12px}#rc .logo svg{display:block;width:100%;height:100%}
#rc .name{font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.2}
#rc .sub{margin:2px 0 28px;color:var(--mute);font-size:14px;letter-spacing:.02em}
#rc h1{font-size:22px;line-height:1.3;margin:0 0 10px;letter-spacing:-.015em;font-weight:700}
#rc p{margin:0 0 14px;color:var(--mute);font-size:15px}
#rc ol{text-align:left;margin:18px 0 22px;padding:0 0 0 22px;color:var(--mute);font-size:15px}
#rc ol li{margin:0 0 8px}
#rc b{color:var(--fg);font-weight:600}
#rc ol.steps{list-style:none;padding:0;margin:22px 0 18px;display:grid;gap:8px}
#rc .steps li{display:flex;gap:12px;align-items:flex-start;margin:0;padding:13px 14px;border-radius:14px;background:var(--card)}
#rc .steps .n{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;background:var(--ac);color:#fff;font-size:13px;font-weight:700;line-height:24px;text-align:center}
#rc .steps svg{width:19px;height:19px;vertical-align:-4px;margin:0 1px;color:var(--ac)}
#rc .paste{display:flex;gap:8px;margin:8px 0 0}
#rc input{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
#rc input:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:transparent}
#rc button{height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--ac);color:#fff;font:600 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
#rc button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
#rc button.block{display:block;width:100%;margin:10px 0 0}
#rc button:active{transform:scale(.98)}
#rc .err{color:var(--bad);font-size:13px;min-height:20px;margin:8px 0 0}
#rc .spin{width:28px;height:28px;margin:6px auto 18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:rcs .8s linear infinite}
@keyframes rcs{to{transform:rotate(360deg)}}
#rc .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:18px auto 0;max-width:240px}
#rc .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#rc .lock{display:inline-flex;align-items:center;gap:6px;margin-top:26px;font-size:12px;color:var(--mute)}

<body>
<div id="rc"><div class="card" id="view"><div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ab4ff"/><stop offset="1" stop-color="#0169cc"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><path d="M32 13c7 9 13 16 13 23.5a13 13 0 0 1-26 0C19 29 25 22 32 13z" fill="#fff"/></svg></div><div class="name">Liquid Agent</div><div class="sub">Remote control</div><div class="spin"></div></div></div>
<div id="root"></div>
<script>
"use strict";
(() => {
  const KEY_STORE = "larc:key";
  const DEAD_STORE = "larc:dead"; // a link key to ignore: rejected, or replaced by a pasted one
  const SKIP_STORE = "larc:noinstall"; // "Continue in Safari" was chosen for this key
  const CACHE = "larc-ui-v1";
  const CHUNK = 192 * 1024;
  const RELAY = (location.protocol === "http:" ? "ws://" : "wss://") + location.host + "/relay";
  const rc = document.getElementById("rc");
  const view = document.getElementById("view");
  const enc = new TextEncoder(), dec = new TextDecoder();
  const ua = navigator.userAgent;
  const ios = document.documentElement.classList.contains("ios");
  const standalone = () => navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

  // Chrome and Edge: keep the install prompt for the Install button in Settings → Remote.
  let installEvent = null;
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvent = e; });
  addEventListener("appinstalled", () => (installEvent = null));

  // ---- Small helpers ----
  const lockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const shareIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M8 10H6.5A2.5 2.5 0 0 0 4 12.5v7A2.5 2.5 0 0 0 6.5 22h11a2.5 2.5 0 0 0 2.5-2.5v-7a2.5 2.5 0 0 0-2.5-2.5H16"/></svg>';
  const addIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M12 8v8M8 12h8"/></svg>';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const $ = (id) => document.getElementById(id);
  const HEAD = "<div class=\"logo\"><svg viewBox=\"0 0 64 64\" aria-hidden=\"true\"><defs><linearGradient id=\"lg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#5ab4ff\"/><stop offset=\"1\" stop-color=\"#0169cc\"/></linearGradient></defs><rect width=\"64\" height=\"64\" rx=\"16\" fill=\"url(#lg)\"/><path d=\"M32 13c7 9 13 16 13 23.5a13 13 0 0 1-26 0C19 29 25 22 32 13z\" fill=\"#fff\"/></svg></div><div class=\"name\">Liquid Agent</div><div class=\"sub\">Remote control</div>";
  function show(html) {
    rc.hidden = false;
    view.innerHTML = HEAD + html + '<div class="lock">' + lockIcon + "End-to-end encrypted</div>";
  }
  function b64u(bytes) {
    let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unb64u(s) {
    const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  const ls = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const keyFrom = (text) => {
    const m = String(text || "").match(/(?:^|[#&?/])k=([A-Za-z0-9_-]{43})(?:$|&)/) || String(text || "").trim().match(/^([A-Za-z0-9_-]{43})$/);
    return m ? m[1] : "";
  };

  // ---- Pairing ----
  // A Home Screen app always starts from the address it was saved with, so a
  // key that stopped working there is remembered and skipped.
  const linkKey = keyFrom(location.hash);
  let key = linkKey && linkKey !== ls.get(DEAD_STORE) ? linkKey : "";
  if (key) ls.set(KEY_STORE, key);
  else key = ls.get(KEY_STORE);
  const askInstall = Boolean(key) && key === linkKey && ios && !standalone() && ls.get(SKIP_STORE) !== key;
  // Keep the key in the address only while it may be saved to the Home Screen.
  if (linkKey) history.replaceState(null, "", location.pathname + (askInstall ? "#k=" + key : "#/"));

  function usePastedKey(k) {
    if (linkKey && linkKey !== k) ls.set(DEAD_STORE, linkKey);
    ls.set(KEY_STORE, k);
    location.replace(location.pathname + "#/");
    location.reload();
  }

  function pairScreen(error) {
    const clip = Boolean(navigator.clipboard && navigator.clipboard.readText);
    show(
      "<h1>Control Liquid Agent from here</h1>" +
        "<p>Use your chats, routines and everything else on your computer's Liquid Agent from this " + (navigator.maxTouchPoints > 0 ? "device" : "browser") + ".</p>" +
        "<ol><li>On your computer, open <b>Liquid Agent</b>.</li><li>Go to <b>Settings → Remote</b> and turn on <b>Remote control</b>.</li><li>Scan the QR code with this phone's camera, or copy the link and paste it here.</li></ol>" +
        '<form class="paste" id="pf"><input id="pl" placeholder="Paste the link" inputmode="url" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" /><button>Connect</button></form>' +
        (clip ? '<button type="button" class="ghost block" id="pc">Paste from clipboard</button>' : "") +
        '<div class="err" id="pe">' + esc(error || "") + "</div>"
    );
    const bad = () => ($("pe").textContent = "That isn't a Liquid Agent remote link.");
    $("pf").onsubmit = (e) => {
      e.preventDefault();
      const k = keyFrom($("pl").value);
      if (!k) return void bad();
      usePastedKey(k);
    };
    if (clip)
      $("pc").onclick = async () => {
        try {
          const text = await navigator.clipboard.readText();
          const k = keyFrom(text);
          if (!k) return void bad();
          usePastedKey(k);
        } catch {
          $("pe").textContent = "Couldn't read the clipboard. Paste the link into the box instead.";
        }
      };
  }
  function forget() {
    ls.del(KEY_STORE);
    location.replace(location.pathname);
  }

  // ---- Add to Home Screen (iPhone and iPad) ----
  function installSheet(label, done) {
    const other = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
    show(
      "<h1>Add Liquid Agent to your Home Screen</h1>" +
        "<p>It opens full screen like an app and stays paired with your computer.</p>" +
        '<ol class="steps">' +
        '<li><span class="n">1</span><div>Tap <b>Share</b> ' + shareIcon + (other ? " in the address bar." : " in Safari's toolbar, or under <b>•••</b> first.") + "</div></li>" +
        '<li><span class="n">2</span><div>Choose <b>Add to Home Screen</b> ' + addIcon + ". Scroll down if you don't see it.</div></li>" +
        '<li><span class="n">3</span><div>Keep <b>Open as Web App</b> on, tap <b>Add</b>, then open <b>Liquid Agent</b> from your Home Screen.</div></li>' +
        "</ol>" +
        '<button class="ghost block" id="cs">' + esc(label) + "</button>"
    );
    $("cs").onclick = done;
  }

  if (!key) return pairScreen();

  // ---- Crypto: AES-256-GCM, the key from the link. The relay never sees it. ----
  let aes;
  const ready = (async () => {
    aes = await crypto.subtle.importKey("raw", unb64u(key), "AES-GCM", false, ["encrypt", "decrypt"]);
    const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("liquid-rc-room:" + key)));
    return b64u(h).slice(0, 32);
  })();
  async function seal(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: enc.encode("c2h") }, aes, enc.encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length);
    out.set(iv);
    out.set(ct, 12);
    return b64u(out);
  }
  async function open(d) {
    const raw = unb64u(d);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.subarray(0, 12), additionalData: enc.encode("h2c") }, aes, raw.subarray(12));
    return JSON.parse(dec.decode(pt));
  }

  // ---- Relay link ----
  let ws = null, hostUp = false, retry = 0, booted = false, badKey = false, started = false;
  let heard = 0; // when the relay last sent anything
  const pending = new Map(); // request id -> {resolve, reject, timer}
  const sockets = new Map(); // socket id -> RemoteSocket
  const parts = new Map();
  const waiters = [];
  let nextId = 1;
  let inbox = Promise.resolve();
  let outbox = Promise.resolve();

  const whenUp = () => (hostUp ? Promise.resolve() : new Promise((r) => waiters.push(r)));
  function setHost(up) {
    hostUp = up;
    if (up) {
      while (waiters.length) waiters.shift()();
      if (!booted) boot();
    } else {
      for (const p of pending.values()) p.reject(new Error("Lost the connection to your computer."));
      pending.clear();
      for (const s of [...sockets.values()]) s._closed();
      if (!booted && !badKey) offline();
    }
  }

  let again = null;
  async function connect() {
    clearTimeout(again);
    const room = await ready;
    if (badKey || (ws && ws.readyState <= 1)) return;
    const sock = new WebSocket(RELAY + "?role=client&room=" + room);
    ws = sock;
    sock.onopen = () => (retry = 0);
    sock.onmessage = (m) => {
      heard = Date.now();
      let f;
      try { f = JSON.parse(m.data); } catch { return; }
      if (f.ev === "host") return setHost(Boolean(f.up));
      if (f.x === "bad-key") return keyRejected();
      if (typeof f.d !== "string") return;
      let d = f.d;
      if (f.m) {
        const buf = parts.get(f.m) || [];
        buf[f.i] = d;
        parts.set(f.m, buf);
        if (booting) progress.got(d.length);
        if (buf.filter(Boolean).length < f.n) return;
        parts.delete(f.m);
        d = buf.join("");
      } else if (booting) progress.got(d.length);
      // Decrypt right away, but hand messages on in the order they came (voice audio needs it).
      const msg = open(d);
      inbox = inbox.then(() => msg.then(onMessage, () => {}));
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      ws = null;
      setHost(false);
      retry = Math.min(retry + 1, 5);
      again = setTimeout(connect, 500 * 2 ** retry);
    };
  }

  /** Drops a link that looks alive but isn't (a phone woke up on another network, say) and dials again. */
  function redial(sock) {
    if (ws !== sock) return;
    sock.onclose = null;
    try { sock.close(); } catch {}
    ws = null;
    setHost(false);
    retry = 0;
    connect();
  }

  /** After the page comes back: check the link really works, quickly. */
  function check() {
    if (!started || badKey) return;
    if (!ws || ws.readyState > 1) { retry = 0; return void connect(); }
    if (ws.readyState !== 1) return;
    const sock = ws;
    // With the computer away there's nothing to lose: just dial again.
    if (!hostUp) return redial(sock);
    const since = Date.now();
    seal({ t: "ping" }).then((d) => sock.readyState === 1 && sock.send(JSON.stringify({ d })), () => {});
    setTimeout(() => { if (heard < since) redial(sock); }, 5000);
  }

  /** Encrypts and sends. Messages leave in the order they were sent, even while several are being encrypted. */
  function sendMsg(obj) {
    const sealed = whenUp().then(() => seal(obj));
    const run = outbox.then(() => sealed).then((d) => {
      if (!ws || ws.readyState !== 1) throw new Error("Lost the connection to your computer.");
      if (d.length <= CHUNK) return ws.send(JSON.stringify({ d }));
      const m = Math.random().toString(36).slice(2, 10);
      const n = Math.ceil(d.length / CHUNK);
      for (let i = 0; i < n; i++) ws.send(JSON.stringify({ d: d.slice(i * CHUNK, (i + 1) * CHUNK), m, i, n }));
    });
    outbox = run.catch(() => {});
    return run;
  }

  function onMessage(msg) {
    if (msg.t === "res") {
      const p = pending.get(msg.id);
      if (!p) return;
      pending.delete(msg.id);
      clearTimeout(p.timer);
      p.resolve(msg);
    } else if (msg.t === "opened") sockets.get(msg.s)?._opened();
    else if (msg.t === "ev") sockets.get(msg.s)?._message(msg);
    else if (msg.t === "shut") sockets.get(msg.s)?._closed();
    // "pong" needs nothing: hearing anything at all marks the link alive.
  }

  function keyRejected() {
    if (badKey) return;
    badKey = true;
    for (const p of pending.values()) p.reject(new Error("This link no longer works."));
    pending.clear();
    ls.del(KEY_STORE);
    ls.set(DEAD_STORE, key);
    if (ws) { const s = ws; ws = null; s.onclose = null; s.close(); }
    rc.classList.remove("over");
    pairScreen(
      standalone() && ios
        ? "That link no longer works. Paste the new one from Liquid Agent's Settings → Remote, or add the new link to your Home Screen."
        : "That link no longer works. Scan the new code in Liquid Agent's Settings → Remote."
    );
  }

  // ---- fetch() for the app ----
  async function bodyBytes(body) {
    if (body == null) return null;
    if (typeof body === "string") return enc.encode(body);
    if (body instanceof Blob) return new Uint8Array(await body.arrayBuffer());
    if (body instanceof ArrayBuffer) return new Uint8Array(body);
    if (ArrayBuffer.isView(body)) return new Uint8Array(body.buffer, body.byteOffset, body.byteLength);
    return enc.encode(String(body));
  }
  async function rcFetch(input, init) {
    init = init || {};
    const path = typeof input === "string" ? input : input.url;
    const url = new URL(path, location.href);
    const h = {};
    new Headers(init.headers || {}).forEach((v, k) => (h[k] = v));
    const bytes = await bodyBytes(init.body);
    if (!hostUp) throw new TypeError("Your computer isn't connected.");
    const id = nextId++;
    const res = await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new TypeError("Your computer didn't answer."));
      }, 600000);
      pending.set(id, { resolve, reject, timer });
      sendMsg({ t: "req", id, m: (init.method || "GET").toUpperCase(), p: url.pathname + url.search, h, b: bytes ? b64u(bytes) : "" }).catch((e) => {
        pending.delete(id);
        clearTimeout(timer);
        reject(e);
      });
    });
    const status = res.s >= 200 && res.s <= 599 ? res.s : 502;
    const nobody = status === 204 || status === 205 || status === 304;
    return new Response(nobody ? null : unb64u(res.b || ""), { status, headers: res.h || {} });
  }

  // ---- WebSockets: the app's live updates (/ws) and voice chat (/voice) ----
  class RemoteSocket {
    constructor(path) {
      this.readyState = 0;
      this.binaryType = "blob";
      this.bufferedAmount = 0;
      this.onopen = this.onmessage = this.onclose = this.onerror = null;
      this.sid = Math.random().toString(36).slice(2, 10);
      sockets.set(this.sid, this);
      if (!hostUp) {
        // Let the app's own retry loop try again shortly.
        setTimeout(() => this._closed(), 1500);
        return;
      }
      sendMsg({ t: "open", s: this.sid, p: String(path || "/ws").split("?")[0] }).catch(() => this._closed());
    }
    _opened() {
      if (this.readyState !== 0) return;
      this.readyState = 1;
      this.onopen?.({ type: "open" });
    }
    _message(msg) {
      if (this.readyState !== 1) return;
      let data = msg.data;
      if (typeof msg.bin === "string") {
        const bytes = unb64u(msg.bin);
        data = this.binaryType === "arraybuffer" ? bytes.buffer : new Blob([bytes]);
      }
      this.onmessage?.({ type: "message", data });
    }
    _closed() {
      if (this.readyState === 3) return;
      this.readyState = 3;
      sockets.delete(this.sid);
      this.onclose?.({ type: "close", code: 1006, reason: "" });
    }
    send(data) {
      if (this.readyState !== 1) return;
      const fail = () => this._closed();
      if (typeof data === "string") return void sendMsg({ t: "send", s: this.sid, data }).catch(fail);
      if (data instanceof Blob) return void data.arrayBuffer().then((b) => this.send(b), fail);
      const bytes = data instanceof ArrayBuffer ? new Uint8Array(data) : new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
      sendMsg({ t: "send", s: this.sid, bin: b64u(bytes) }).catch(fail);
    }
    close() {
      if (this.readyState === 3) return;
      sendMsg({ t: "shut", s: this.sid }).catch(() => {});
      this._closed();
    }
  }

  RemoteSocket.CONNECTING = 0;
  RemoteSocket.OPEN = 1;
  RemoteSocket.CLOSING = 2;
  RemoteSocket.CLOSED = 3;

  // ---- Pictures and recordings in chats: fetched once, shown from blob: URLs ----
  const fileURLs = new Map();
  function fileURL(path) {
    let p = fileURLs.get(path);
    if (!p) {
      p = rcFetch(path)
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.blob();
        })
        .then((b) => URL.createObjectURL(b));
      p.catch(() => fileURLs.delete(path));
      fileURLs.set(path, p);
    }
    return p;
  }

  // ---- Attachments open as blobs ----
  function openFile(path) {
    const w = window.open("", "_blank");
    rcFetch(path)
      .then((r) => r.blob())
      .then((b) => {
        const u = URL.createObjectURL(b);
        if (w) w.location.href = u;
        else location.href = u;
      })
      .catch(() => w && w.close());
  }

  // ---- Install, for Settings → Remote ----
  const installable = () => (standalone() ? "standalone" : installEvent ? "prompt" : ios ? "ios" : "");
  async function install() {
    if (installEvent) {
      const e = installEvent;
      installEvent = null;
      try {
        await e.prompt();
        return (await e.userChoice).outcome;
      } catch {
        return "dismissed";
      }
    }
    if (!ios || standalone()) return "unavailable";
    // Put the key back in the address for Add to Home Screen; the app's own route returns after.
    const back = location.hash;
    history.replaceState(null, "", location.pathname + "#k=" + key);
    rc.classList.add("over");
    installSheet("Done", () => {
      history.replaceState(null, "", location.pathname + back);
      rc.hidden = true;
      rc.classList.remove("over");
    });
    return "shown";
  }

  // ---- Screens ----
  function offline() {
    show(
      "<h1>Waiting for your computer</h1>" +
        '<div class="spin"></div>' +
        "<p>Make sure your computer is awake, Liquid Agent is open, and Settings → Remote → Remote control is on. This page connects by itself.</p>" +
        '<div class="row"><button class="ghost" id="fg">Use a different link</button></div>'
    );
    $("fg").onclick = forget;
  }

  let booting = false;
  const progress = {
    total: 0, done: 0,
    got(n) { this.done += n; const el = $("pb"); if (el && this.total) el.style.width = Math.min(100, (this.done / this.total) * 100) + "%"; },
  };

  // ---- Load Liquid Agent's own UI from the computer, keep it cached by file name ----
  async function cached(path) {
    const req = new Request(location.origin + "/__la" + path);
    let c = null;
    try { c = await caches.open(CACHE); const hit = await c.match(req); if (hit) return hit; } catch {}
    const res = await rcFetch(path);
    if (!res.ok) throw new Error("Couldn't load " + path);
    const blob = await res.blob();
    const out = new Response(blob, { headers: { "content-type": res.headers.get("content-type") || "" } });
    try { if (c) await c.put(req, out.clone()); } catch {}
    return out;
  }

  async function boot() {
    if (booted || booting) return;
    booting = true;
    show('<h1>Loading Liquid Agent…</h1><div class="bar"><i id="pb"></i></div>');
    try {
      const html = await (await rcFetch("/")).text();
      const js = (html.match(/<script[^>]+src="(\/assets\/[^"]+\.js)"/) || [])[1];
      const cssFiles = [...html.matchAll(/<link[^>]+rel="stylesheet"[^>]+href="(\/assets\/[^"]+\.css)"/g)].map((m) => m[1]);
      if (!js) throw new Error("Liquid Agent on your computer is too old for remote control. Update it, then try again.");
      progress.total = 1800000;
      const [jsText, ...cssTexts] = await Promise.all([cached(js).then((r) => r.text()), ...cssFiles.map((f) => cached(f).then((r) => r.text()))]);
      // Fonts (KaTeX math) come from the computer too, as blob URLs.
      const fonts = new Set();
      for (const css of cssTexts) for (const m of css.matchAll(/url\((\/assets\/[^)]+\.woff2)\)/g)) fonts.add(m[1]);
      const blobs = {};
      await Promise.all([...fonts].map(async (f) => { try { blobs[f] = URL.createObjectURL(await (await cached(f)).blob()); } catch {} }));
      for (const css of cssTexts) {
        const style = document.createElement("style");
        style.textContent = css.replace(/url\((\/assets\/[^)]+\.woff2)\)/g, (m, f) => (blobs[f] ? "url(" + blobs[f] + ")" : m));
        document.head.appendChild(style);
      }
      // Drop UI files from older versions.
      try {
        const keep = new Set([js, ...cssFiles, ...fonts].map((p) => location.origin + "/__la" + p));
        const c = await caches.open(CACHE);
        for (const r of await c.keys()) if (!keep.has(r.url)) c.delete(r);
      } catch {}

      const meta = document.createElement("meta");
      meta.name = "liquid-token";
      meta.content = "remote";
      document.head.appendChild(meta);
      window.__LA_REMOTE__ = { fetch: rcFetch, WebSocket: RemoteSocket, openFile, fileURL, forget, install, installable };
      if (!location.hash.startsWith("#/")) history.replaceState(null, "", location.pathname + "#/");
      booted = true;
      booting = false;
      rc.hidden = true;
      document.documentElement.classList.add("la");
      await import(URL.createObjectURL(new Blob([jsText], { type: "text/javascript" })));
    } catch (e) {
      booting = false;
      if (badKey) return;
      show('<h1>Couldn\'t load Liquid Agent</h1><p>' + esc(e.message || e) + '</p><div class="row"><button id="ry">Try again</button><button class="ghost" id="fg">Use a different link</button></div>');
      $("ry").onclick = () => location.reload();
      $("fg").onclick = forget;
    }
  }

  function start() {
    started = true;
    show('<h1>Connecting…</h1><div class="spin"></div>');
    connect();
  }

  if (askInstall)
    installSheet(/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua) ? "Continue in the browser" : "Continue in Safari", () => {
      ls.set(SKIP_STORE, key);
      history.replaceState(null, "", location.pathname + "#/");
      start();
    });
  else start();

  // Phones freeze background pages and may wake up on another network:
  // check the link as soon as the page is back.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  addEventListener("pageshow", (e) => { if (e.persisted) check(); });
  addEventListener("online", check);
})();
</script>
</body>
</html>
